# Builds the binaries a tag promises, and the checksums ./install checks them
# against. Runs on a v-tag, and by hand for a tag that was pushed before this
# workflow existed.
#
# Cross-compiled from one runner rather than built on four: kolo is pure Go
# with CGO off, so the machine doing the building has nothing to contribute.
# Linux and macOS only. A Windows binary compiles, but creack/pty is a Unix
# package, so the host half could not start an agent and shipping one would be
# a promise kolo cannot keep.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      sha: ${{ steps.ref.outputs.sha }}
      prerelease: ${{ steps.ref.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: resolve version tag
        id: ref
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: bash scripts/release-ref.sh "$TAG" >> "$GITHUB_OUTPUT"

  check:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  release:
    needs: [resolve, check]
    permissions:
      contents: write
    # Use the compiler setup-go selected for scans and builds alike.
    env:
      GOTOOLCHAIN: local
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
      PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: toolchain
        run: go version

      # The tag is passed in rather than read back out of the build: at a
      # tagged commit the toolchain still reports the commit, and a downloaded
      # binary should call itself by the tag somebody chose it from.
      - name: build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            echo "building $os/$arch"
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "dist/kolo" ./cmd/kolo
            tar -czf "dist/kolo_${TAG}_${os}_${arch}.tar.gz" -C dist kolo -C "$GITHUB_WORKSPACE" LICENSE
            rm dist/kolo
          done
          cd dist && sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: sanity-check the linux build
        run: |
          tar -xzf "dist/kolo_${TAG}_linux_amd64.tar.gz" -C /tmp kolo
          /tmp/kolo version

      - name: verify the tag still names the checked commit
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA"

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Experimental software for trusted teams. Agents run with the host user's permissions.

          Install this version:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$SHA/install | KOLO_VERSION=$TAG sh
          \`\`\`

          Checksums are in \`SHA256SUMS\`.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "kolo $TAG" \
              --verify-tag --target "$SHA" \
              --prerelease="$PRERELEASE" \
              --generate-notes \
              --notes-file notes.md
          fi
