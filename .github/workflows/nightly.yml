# A build of main every night, for people who want to try what is not tagged
# yet and do not have Go to build it with.
#
# Resolve main once, run the full reusable CI workflow, then package that
# exact commit. A scheduled build must not assume another workflow passed.
#
# The binaries land on one rolling prerelease tag, `nightly`, which is
# replaced each time. Prerelease matters: GitHub's "latest release" skips
# prereleases, so ./install keeps pointing at the newest real version and
# nobody gets a nightly by accident. Asking for one is explicit:
#
#   curl -fsSL .../install | KOLO_VERSION=nightly sh

name: nightly

on:
  # 03:17 UTC, which is early morning where kolo is worked on, so a night's
  # merges are packaged before anybody is up to want them. Off the hour on
  # purpose: every repo that writes a schedule writes one at :00, and GitHub
  # runs these when it has room, so the crowded minute is the one that gets
  # delayed or dropped.
  #
  # GitHub also disables a schedule after 60 days with no activity in the
  # repository. If kolo ever goes that quiet, the nightly stops without
  # saying so, and the run below is how it starts again.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.moved.outputs.sha }}
      build: ${{ steps.moved.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      # A quiet day should cost nothing. The published nightly records the
      # commit it came from, so main sitting still means there is nothing to
      # build and the rest of the job is skipped.
      - name: has main moved
        id: moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          built=$(gh release view nightly --json body -q .body 2>/dev/null \
            | sed -n 's/.*commit `\([0-9a-f]*\)`.*/\1/p' | head -1)
          if [ "$built" = "$sha" ]; then
            echo "nightly already covers $sha"
            echo "build=no" >> "$GITHUB_OUTPUT"
          else
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: prepare
    if: needs.prepare.outputs.build == 'yes'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  nightly:
    needs: [prepare, check]
    if: needs.prepare.outputs.build == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOTOOLCHAIN: local
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: toolchain
        run: go version

      # Named for the tag rather than the date, so the archive ./install asks
      # for is the same string every night and KOLO_VERSION=nightly resolves
      # without knowing today's date. The date is in what the binary reports.
      - name: build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          stamp="nightly-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "stamp=$stamp" >> "$GITHUB_ENV"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$stamp" \
              -o "dist/kolo" ./cmd/kolo
            tar -czf "dist/kolo_nightly_${os}_${arch}.tar.gz" -C dist kolo -C "$GITHUB_WORKSPACE" LICENSE
            rm dist/kolo
          done
          cd dist && sha256sum *.tar.gz > SHA256SUMS

      - name: sanity-check the linux build
        run: |
          tar -xzf dist/kolo_nightly_linux_amd64.tar.gz -C /tmp kolo
          /tmp/kolo version

      # This tag intentionally moves; version tags in release.yml never do.
      - name: advance the rolling nightly tag to the checked commit
        run: |
          git tag --force nightly "$SHA"
          git push --force origin refs/tags/nightly

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          Built from main, commit \`$SHA\`, as \`$stamp\`.

          Experimental alpha for trusted teams. The full Linux/macOS CI checks
          passed for this commit. Agents run with the host user's permissions.
          See [security](https://github.com/$REPO/blob/$SHA/SECURITY.md).

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$REPO/$SHA/install | KOLO_VERSION=nightly sh
          \`\`\`
          EOF

          # The asset names never change, so --clobber is the whole update:
          # last night's binaries are overwritten rather than piling up.
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly dist/* --clobber
            gh release edit nightly --notes-file notes.md --target "$SHA" --prerelease
          else
            gh release create nightly dist/* \
              --title "kolo nightly" \
              --prerelease \
              --verify-tag --target "$SHA" \
              --notes-file notes.md
          fi
